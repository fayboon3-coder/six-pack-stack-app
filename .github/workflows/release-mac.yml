name: Build on GitHub's Mac and send to the App Store

# Same as "Build and send to the App Store", but the iPhone build runs on GitHub's own Mac
# (free for this public repo) instead of Expo's build servers, so it doesn't use Expo build credits.
# Run by hand: Actions → "Build on GitHub's Mac and send to the App Store" → Run workflow.
# Needs the EXPO_TOKEN and KEY secrets (KEY = contents of the App Store Connect API key .p8).
#
# This build also switches on instant updates for App Store users: later fixes that are only
# app code (no new native modules) can go out with "Ship an instant update to App Store users"
# without a new App Store review.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the Expo project
        run: eas init --non-interactive --force
      - name: Switch on instant updates (runtime = app version, production channel)
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));j.expo.runtimeVersion={policy:'appVersion'};fs.writeFileSync(p,JSON.stringify(j,null,2));"
          eas update:configure --platform ios --non-interactive || true
          node -e "const j=require('./app.json');console.log('updates:',JSON.stringify(j.expo.updates),'runtime:',JSON.stringify(j.expo.runtimeVersion))"
      - name: Write the App Store Connect API key
        run: |
          if [ -z "$ASC_KEY" ]; then echo "Add the KEY secret first (contents of AuthKey_CBFD353969.p8)."; exit 1; fi
          printf '%s\n' "$ASC_KEY" > asc-key.p8
          echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-key.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY: ${{ secrets.KEY }}
      - name: Build the iPhone app on this Mac
        run: eas build --platform ios --profile production --local --non-interactive --output "$PWD/SixPackStack.ipa"
        env:
          EXPO_ASC_KEY_ID: CBFD353969
          EXPO_ASC_ISSUER_ID: 9f482997-7bf9-4d18-b66e-c33697f1123c
          EXPO_APPLE_TEAM_ID: 3Q8MNR4RLV
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_PUBLIC_RC_IOS_KEY: appl_xOHRUlMqBXvuSrpVovMIdFVYfLw
      - name: Keep a copy of the build
        uses: actions/upload-artifact@v4
        with:
          name: SixPackStack-ipa
          path: SixPackStack.ipa
      - name: Send it to App Store Connect
        run: eas submit --platform ios --profile production --path "$PWD/SixPackStack.ipa" --non-interactive
        env:
          EXPO_ASC_KEY_ID: CBFD353969
          EXPO_ASC_ISSUER_ID: 9f482997-7bf9-4d18-b66e-c33697f1123c
          EXPO_APPLE_TEAM_ID: 3Q8MNR4RLV
