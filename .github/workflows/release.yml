name: Build and send to the App Store

# Run by hand (Actions → "Build and send to the App Store" → Run workflow).
# Needs the ASC_API_KEY repo secret (contents of the Admin App Store Connect
# API key .p8). EAS uses it to create the signing certificate and profile and
# to upload the build to App Store Connect / TestFlight. No Apple password needed.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Stop if the keys are still placeholders
        run: |
          if grep -q "PASTE_" eas.json; then echo "Fill in the RevenueCat key and App Store app ID in eas.json first."; exit 1; fi
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the Expo project
        run: eas init --non-interactive --force
      - name: Write the App Store Connect API key
        run: |
          if [ -z "$ASC_KEY" ]; then echo "Add the ASC_API_KEY secret first (contents of AuthKey_CBFD353969.p8)."; exit 1; fi
          printf '%s\n' "$ASC_KEY" > asc-key.p8
          echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-key.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY }}
      - name: Build and submit
        run: eas build --platform ios --profile production --auto-submit --non-interactive
        env:
          EXPO_ASC_KEY_ID: CBFD353969
          EXPO_ASC_ISSUER_ID: 9f482997-7bf9-4d18-b66e-c33697f1123c
          EXPO_APPLE_TEAM_ID: 3Q8MNR4RLV
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
