name: Build and send to the App Store

# Run by hand (Actions → "Build and send to the App Store" → Run workflow) once
# the RevenueCat key and App Store Connect app ID are filled in eas.json and
# Apple credentials are saved in Expo (eas credentials). Builds the iPhone app
# and uploads it to App Store Connect / TestFlight.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Stop if the keys are still placeholders
        run: |
          if grep -q "PASTE_" eas.json; then echo "Fill in the RevenueCat key and App Store app ID in eas.json first."; exit 1; fi
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the Expo project
        run: eas init --non-interactive --force
      - name: Build and submit
        run: eas build --platform ios --profile production --auto-submit --non-interactive
