name: fetch-images
on:
  push:
    branches: [image-staging]
    paths: [tools/queries.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidates from Unsplash (free license, no Unsplash+)
        run: python3 tools/fetch.py
      - name: Commit
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add out
          git commit -m "candidates" || echo nothing
          git push
