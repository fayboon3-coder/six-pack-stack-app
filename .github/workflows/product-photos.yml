name: Find product photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/find_product_photos.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -b pcand && git add pcand && git commit -qm "product photo candidates [skip ci]" && git push -f origin pcand
