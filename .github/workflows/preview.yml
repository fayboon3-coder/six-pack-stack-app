name: Publish preview to Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nothing reaches phones unless the code typechecks and every test passes.
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the Expo project
        run: eas init --non-interactive --force
      # The commit message goes in through an env var (never pasted into the script), first line only,
      # so quotes or symbols in a message can't break or change the command.
      - name: Publish update
        env:
          MSG: ${{ github.event.head_commit.message || 'manual' }}
        run: eas update --branch main --message "$(printf '%s' "$MSG" | head -n 1 | cut -c 1-120)" --non-interactive --platform ios
