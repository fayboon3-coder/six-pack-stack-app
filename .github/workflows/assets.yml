name: Fetch product photos

on:
  push:
    branches: [main]
    paths: ['tools/sources.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "rembg[cpu]" pillow
      - run: python tools/fetch_assets.py
      - name: Commit new photos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/img assets/raw
          git diff --cached --quiet || (git commit -m "Add product photos [skip ci]" && git push)
