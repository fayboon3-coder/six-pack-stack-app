name: Find meal photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/find_meal_photos.py
        env: { ONLY_URLS: '1' }
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -b cand && git add cand && git commit -qm "meal photo candidates [skip ci]" && git push -f origin cand
